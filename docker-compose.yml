services:
  db:
    image: postgis/postgis:16-3.4
    container_name: carnac-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: carnac
      POSTGRES_PASSWORD: carnac
      POSTGRES_DB: carnac
    ports:
      - "5432:5432"
    volumes:
      - carnac_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carnac -d carnac"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Lets the Neon serverless driver reach the local Postgres.
  #
  # Prisma talks to Postgres through a driver adapter rather than its own Rust
  # binary, which is what keeps each Vercel deployment small. The Neon driver
  # speaks WebSocket rather than raw TCP, so locally it needs something to turn
  # one into the other — that is all this is. Production talks to Neon
  # directly and never uses it.
  wsproxy:
    image: ghcr.io/neondatabase/wsproxy:latest
    container_name: carnac-wsproxy
    restart: unless-stopped
    environment:
      APPEND_PORT: "db:5432"
      ALLOW_ADDR_REGEX: ".*"
      LOG_TRAFFIC: "false"
    ports:
      - "5433:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  carnac_db_data:
