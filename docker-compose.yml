services:
  db:
    image: postgis/postgis:16-3.4
    container_name: carnac-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: carnac
      POSTGRES_PASSWORD: carnac
      POSTGRES_DB: carnac
    ports:
      - "5432:5432"
    volumes:
      - carnac_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carnac -d carnac"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  carnac_db_data:
